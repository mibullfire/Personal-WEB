      width: 10px; height: 10px;
      background: var(--accent); border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }
    .cursor-follower {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(255,77,171,0.4); border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, width 0.3s, height 0.3s, border-color 0.3s;
    }
    body:has(button:hover) .cursor { width: 16px; height: 16px; }
    body:has(button:hover) .cursor-follower { width: 56px; height: 56px; border-color: rgba(255,77,171,0.8); }
    body:has(a:hover) .cursor { width: 16px; height: 16px; }
    body:has(a:hover) .cursor-follower { width: 56px; height: 56px; border-color: rgba(255,77,171,0.8); }

      body { cursor: auto; }
      button { cursor: auto; }
      .cursor, .cursor-follower { display: none; }

      transition: color 0.3s, border-color 0.3s, background 0.3s;

    .tool-main {

    }

    .tool-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; letter-spacing: -0.04em; }
    .tool-subtitle { font-size: 0.92rem; color: var(--gray); margin-top: 0.3rem; }

    /* ── Progress ── */
    .progress-row {
      display: flex; align-items: center; gap: 1rem;
    }
    .progress-bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--dark2);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: var(--accent);
      border-radius: 100px;
      transition: width 0.5s ease;
      width: 0%;
    }
    .progress-label {
      font-size: 0.8rem; font-weight: 600; color: var(--gray);
      white-space: nowrap; min-width: 60px; text-align: right;
    }

    /* ── Card ── */
    .phrase-card {
      min-height: 260px;
      background: var(--dark);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2.5rem 2rem;
      text-align: center;
      position: relative; overflow: hidden;
      gap: 1.2rem;
    }
    .phrase-card::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 100%, rgba(255,77,171,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .phrase-number {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent); opacity: 0.7;
      z-index: 1;

    .phrase-text {
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      font-weight: 600;
      line-height: 1.55;
      letter-spacing: -0.01em;
      color: var(--white);
      z-index: 1;
      transition: opacity 0.2s;

    .phrase-text { transition: opacity 0.25s, transform 0.25s; }

    .phrase-empty {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--gray2);
      z-index: 1;
    }

    .phrase-done {
      display: none;
      flex-direction: column; align-items: center; gap: 0.5rem;
      z-index: 1;
    }
    .phrase-done-title {
      font-family: 'Playfair Display', serif;

      color: var(--accent);

    /* ── Buttons ── */
    .btn-next {

      font-size: 1rem; font-weight: 800;

    .btn-next:active { transform: translateY(0); box-shadow: none; }
    .btn-next:disabled { opacity: 0.35; pointer-events: none; }

    .secondary-row { display: flex; gap: 0.8rem; }

    .btn-secondary {
      flex: 1;
      background: transparent; color: var(--gray);
      border: 1px solid rgba(255,255,255,0.09); border-radius: 100px;

      font-size: 0.83rem; font-weight: 600;

</head>

      shuffle(remaining);
      played = [];
      updateUI();
      document.getElementById('phraseEmpty').style.display = 'block';
      document.getElementById('phraseNumber').style.display = 'none';
      document.getElementById('phraseText').style.display = 'none';
      document.getElementById('phraseDone').style.display = 'none';
      document.getElementById('btnNext').disabled = false;
      renderHistory();
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function next() {
      if (remaining.length === 0) return;

      const idx = remaining.pop();
      const entry = { idx, n: played.length + 1 };
      played.push(entry);

      const phraseText = document.getElementById('phraseText');
      const phraseNumber = document.getElementById('phraseNumber');
      const phraseEmpty = document.getElementById('phraseEmpty');
      const phraseDone = document.getElementById('phraseDone');

      phraseEmpty.style.display = 'none';
      phraseDone.style.display = 'none';

      phraseText.classList.add('fading');
      setTimeout(() => {
        phraseNumber.textContent = `Nº ${entry.n} de ${TOTAL}`;
        phraseNumber.style.display = 'block';
        phraseText.textContent = ALL_PHRASES[idx];
        phraseText.style.display = 'block';
        phraseText.classList.remove('fading');
      }, 200);

      if (remaining.length === 0) {
        document.getElementById('btnNext').disabled = true;
        setTimeout(() => {
          phraseText.style.display = 'none';
          phraseNumber.style.display = 'none';
          phraseDone.style.display = 'flex';
        }, 400);
      }

      updateUI();
      if (historyVisible) renderHistory();
    }

    function updateUI() {
      const done = played.length;
      const pct = (done / TOTAL) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressLabel').textContent = done + ' / ' + TOTAL;
      document.getElementById('btnToggleHistory').textContent =
        (historyVisible ? 'Ocultar historial' : 'Ver historial') + ' (' + done + ')';
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (played.length === 0) {
        list.innerHTML = '<div style="color:var(--gray);font-size:0.83rem;padding:0.5rem 0.9rem;">Aún no se ha jugado ninguna frase.</div>';
        return;
      }
      list.innerHTML = [...played].reverse().map(e =>
        `<div class="history-item"><span class="history-n">${e.n}</span><span>${ALL_PHRASES[e.idx]}</span></div>`
      ).join('');
    }

    document.getElementById('btnNext').addEventListener('click', next);

    document.getElementById('btnToggleHistory').addEventListener('click', () => {
      historyVisible = !historyVisible;
      const sec = document.getElementById('historySection');
      sec.classList.toggle('visible', historyVisible);

    });

    document.addEventListener('keydown', e => {
