<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bola 8 — Miguel Toro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../img/web-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a; --dark: #111111; --dark2: #1a1a1a;
      --white: #f5f5f5; --white2: #e0e0e0; --gray: #888; --gray2: #444;
      --accent: #ff4dab; --accent2: #ff1a96; --radius: 12px; --radius-lg: 16px;
    }
    html { font-size: 16px; }
    body { background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; overflow-x: hidden; cursor: none; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    button { cursor: none; font-family: inherit; border: none; outline: none; }

    .cursor { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width .3s, height .3s; }
    .cursor-follower { width: 36px; height: 36px; border: 1.5px solid rgba(255,77,171,.4); border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: transform .15s ease, width .3s, height .3s, border-color .3s; }
    body:has(a:hover) .cursor, body:has(button:hover) .cursor { width: 16px; height: 16px; }
    body:has(a:hover) .cursor-follower, body:has(button:hover) .cursor-follower { width: 56px; height: 56px; border-color: rgba(255,77,171,.8); }
    @media (pointer: coarse) { body { cursor: auto; } button { cursor: auto; } .cursor, .cursor-follower { display: none; } }

    .app-nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2.5rem; background: rgba(10,10,10,.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,.06); }
    .app-nav-logo { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: .95rem; letter-spacing: -.02em; }
    .app-nav-star { color: var(--accent); animation: navSpin 8s linear infinite; }
    @keyframes navSpin { to { transform: rotate(360deg); } }
    .app-nav-back { font-size: .82rem; font-weight: 600; color: var(--gray); padding: .45rem 1rem; border: 1px solid rgba(255,255,255,.09); border-radius: 100px; transition: color .3s, border-color .3s, background .3s; }
    .app-nav-back:hover { color: var(--accent); border-color: rgba(255,77,171,.3); background: rgba(255,77,171,.05); }

    .tool-main { flex: 1; max-width: 560px; width: 100%; margin: 0 auto; padding: 3rem 2rem 5rem; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
    .tool-title-row { display: flex; align-items: center; gap: 1rem; margin-bottom: .4rem; width: 100%; }
    .tool-icon { font-size: 1.8rem; background: rgba(255,77,171,.08); border: 1px solid rgba(255,77,171,.2); padding: .3rem .65rem; border-radius: var(--radius); line-height: 1.3; }
    .tool-title { font-size: clamp(1.6rem,4vw,2.4rem); font-weight: 900; letter-spacing: -.04em; }
    .tool-subtitle { font-size: .92rem; color: var(--gray); width: 100%; }

    /* ── Question input ── */
    .question-wrap { width: 100%; display: flex; gap: .7rem; }
    .question-input { flex: 1; background: var(--dark2); color: var(--white2); border: 1px solid rgba(255,255,255,.1); border-radius: var(--radius); padding: .85rem 1rem; font-size: .95rem; outline: none; transition: border-color .3s; }
    .question-input:focus { border-color: rgba(255,77,171,.4); }
    .question-input::placeholder { color: var(--gray2); }

    /* ── Ball ── */
    .ball-area { display: flex; flex-direction: column; align-items: center; gap: 1.6rem; }

    .ball {
      width: min(260px, 72vw); height: min(260px, 72vw);
      border-radius: 50%;
      background: radial-gradient(circle at 36% 33%, #3c3c3c 0%, #181818 38%, #000 68%);
      box-shadow:
        inset -6px -8px 18px rgba(0,0,0,.95),
        inset 4px 4px 10px rgba(255,255,255,.04),
        0 16px 50px rgba(0,0,0,.7),
        0 0 0 3px rgba(255,255,255,.04);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      user-select: none;
    }
    /* Specular highlight */
    .ball::before {
      content: ''; position: absolute; top: 9%; left: 14%;
      width: 38%; height: 26%;
      background: radial-gradient(ellipse, rgba(255,255,255,.14) 0%, transparent 70%);
      border-radius: 50%; transform: rotate(-22deg); pointer-events: none;
    }

    .ball-eight {
      position: absolute; z-index: 1;
      font-size: clamp(3.5rem, 14vw, 5rem); font-weight: 900;
      color: #fff; letter-spacing: -.05em;
      transition: opacity .35s;
    }
    .ball-eight.hidden { opacity: 0; }

    .ball-window {
      position: absolute; z-index: 2;
      width: 54%; height: 54%; border-radius: 50%;
      background: radial-gradient(circle at 38% 33%, #1a237e, #050c35);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .5s .15s;
      padding: 8%;
    }
    .ball-window.show { opacity: 1; }

    .ball-answer {
      font-size: clamp(.6rem, 2.5vw, .8rem); font-weight: 700;
      color: #90caf9; text-align: center; line-height: 1.4;
      letter-spacing: .01em;
    }

    /* Shake animation */
    @keyframes ballShake {
      0%   { transform: rotate(0deg) scale(1); }
      8%   { transform: rotate(-10deg) scale(.96); }
      18%  { transform: rotate(10deg) scale(1.03); }
      28%  { transform: rotate(-7deg) scale(.98); }
      38%  { transform: rotate(7deg) scale(1.02); }
      48%  { transform: rotate(-4deg) scale(.99); }
      58%  { transform: rotate(4deg) scale(1); }
      70%  { transform: rotate(-2deg); }
      82%  { transform: rotate(2deg); }
      92%  { transform: rotate(-1deg); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .ball.shaking { animation: ballShake .85s ease forwards; }

    /* Tone border */
    .ball.positive { box-shadow: inset -6px -8px 18px rgba(0,0,0,.95), inset 4px 4px 10px rgba(255,255,255,.04), 0 16px 50px rgba(0,0,0,.7), 0 0 0 3px rgba(33,150,243,.4); }
    .ball.neutral  { box-shadow: inset -6px -8px 18px rgba(0,0,0,.95), inset 4px 4px 10px rgba(255,255,255,.04), 0 16px 50px rgba(0,0,0,.7), 0 0 0 3px rgba(245,158,11,.4); }
    .ball.negative { box-shadow: inset -6px -8px 18px rgba(0,0,0,.95), inset 4px 4px 10px rgba(255,255,255,.04), 0 16px 50px rgba(0,0,0,.7), 0 0 0 3px rgba(239,68,68,.4); }

    /* ── Buttons ── */
    .btn-consult { background: var(--accent); color: var(--black); border-radius: 100px; padding: .9rem 2.5rem; font-size: 1rem; font-weight: 800; letter-spacing: -.02em; transition: background .3s, transform .15s, box-shadow .3s; }
    .btn-consult:hover { background: var(--accent2); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(255,77,171,.3); }
    .btn-consult:active { transform: translateY(0); }
    .btn-consult:disabled { opacity: .4; pointer-events: none; }

    .btn-reset { background: transparent; color: var(--gray); border: 1px solid rgba(255,255,255,.09); border-radius: 100px; padding: .55rem 1.4rem; font-size: .83rem; font-weight: 600; transition: color .3s, border-color .3s; display: none; }
    .btn-reset.show { display: inline-flex; }
    .btn-reset:hover { color: var(--white); border-color: rgba(255,255,255,.2); }

    /* ── History ── */
    .history-section { width: 100%; display: none; flex-direction: column; gap: .6rem; }
    .history-section.visible { display: flex; }
    .history-label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--gray); }
    .history-list { display: flex; flex-direction: column; gap: .35rem; max-height: 200px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--gray2) transparent; }
    .history-item { font-size: .84rem; color: var(--white2); padding: .5rem .85rem; background: var(--dark2); border: 1px solid rgba(255,255,255,.05); border-radius: var(--radius); line-height: 1.4; animation: histIn .2s ease; }
    @keyframes histIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--accent); color: var(--black); padding: .55rem 1.4rem; border-radius: 100px; font-size: .85rem; font-weight: 700; opacity: 0; pointer-events: none; z-index: 1000; white-space: nowrap; transition: opacity .25s, transform .25s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .app-footer { display: flex; align-items: center; justify-content: space-between; padding: 1.4rem 2.5rem; border-top: 1px solid rgba(255,255,255,.06); font-size: .8rem; color: var(--gray); }
    .app-footer a { color: var(--gray); font-weight: 600; transition: color .3s; }
    .app-footer a:hover { color: var(--accent); }

    @media (max-width: 600px) { .app-nav { padding: 1rem 1.2rem; } .tool-main { padding: 2rem 1.2rem 4rem; } .app-footer { flex-direction: column; gap: .5rem; text-align: center; padding: 1.2rem; } }
  </style>
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <nav class="app-nav">
    <a href="../index.html" class="app-nav-logo"><span class="app-nav-star">✦</span><span>Miguel Toro</span></a>
    <a href="../aplicaciones.html" class="app-nav-back">← Aplicaciones</a>
  </nav>

  <main class="tool-main">
    <div style="width:100%">
      <div class="tool-title-row"><span class="tool-icon">🎱</span><h1 class="tool-title">Bola 8</h1></div>
      <p class="tool-subtitle">Haz tu pregunta y deja que el universo decida.</p>
    </div>

    <div class="question-wrap">
      <input type="text" id="questionInput" class="question-input" placeholder="¿Me toca hoy la lotería?" maxlength="120" />
    </div>

    <div class="ball-area">
      <div class="ball" id="ball">
        <span class="ball-eight" id="ballEight">8</span>
        <div class="ball-window" id="ballWindow">
          <p class="ball-answer" id="ballAnswer"></p>
        </div>
      </div>

      <button class="btn-consult" id="btnConsult">Consultar la bola</button>
      <button class="btn-reset" id="btnReset">Preguntar de nuevo</button>
    </div>

    <div class="history-section" id="historySection">
      <span class="history-label">Consultas anteriores</span>
      <div class="history-list" id="historyList"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <footer class="app-footer">
    <span>✦ Bola 8</span>
    <a href="../aplicaciones.html">← Todas las apps</a>
  </footer>

  <script>
    const cur = document.getElementById('cursor'), fol = document.getElementById('cursorFollower');
    let mx=0,my=0,fx=0,fy=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cur.style.left=mx+'px'; cur.style.top=my+'px'; });
    (function loop(){ fx+=(mx-fx)*.12; fy+=(my-fy)*.12; fol.style.left=fx+'px'; fol.style.top=fy+'px'; requestAnimationFrame(loop); })();

    function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

    const ANSWERS = {
      positive: [
        'Sí, definitivamente.',
        'Es cierto.',
        'Sin duda alguna.',
        'Puedes contar con ello.',
        'En mi opinión, sí.',
        'Las señales apuntan a que sí.',
        'Lo más probable.',
        'Perspectivas muy positivas.',
        'Sí.',
        'Las señales son buenas.',
      ],
      neutral: [
        'Respuesta confusa.\nInténtalo de nuevo.',
        'Pregunta de nuevo\nmás tarde.',
        'Es mejor no\ndecírtelo ahora.',
        'No puedo\npredecirlo ahora.',
        'Concéntrate\ny pregunta de nuevo.',
      ],
      negative: [
        'No cuentes con ello.',
        'Mi respuesta es no.',
        'Mis fuentes dicen que no.',
        'Las perspectivas\nno son buenas.',
        'Muy dudoso.',
      ],
    };

    const TONES = ['positive','positive','positive','positive','positive','neutral','neutral','negative','negative','negative'];

    let shaking = false;
    let history = [];

    const ball       = document.getElementById('ball');
    const ballEight  = document.getElementById('ballEight');
    const ballWindow = document.getElementById('ballWindow');
    const ballAnswer = document.getElementById('ballAnswer');
    const btnConsult = document.getElementById('btnConsult');
    const btnReset   = document.getElementById('btnReset');

    function consult() {
      if (shaking) return;
      shaking = true;
      btnConsult.disabled = true;

      const tone = TONES[Math.floor(Math.random() * TONES.length)];
      const list = ANSWERS[tone];
      const answer = list[Math.floor(Math.random() * list.length)];

      ball.classList.remove('positive','neutral','negative');
      ball.classList.add('shaking');

      setTimeout(() => {
        ball.classList.remove('shaking');
        ballEight.classList.add('hidden');
        ballAnswer.textContent = answer;
        ballWindow.classList.add('show');
        ball.classList.add(tone);
        btnReset.classList.add('show');

        const q = document.getElementById('questionInput').value.trim();
        history.unshift({ q: q || '(sin pregunta)', a: answer.replace('\n',' '), tone });
        if (history.length > 10) history.pop();
        renderHistory();

        shaking = false;
      }, 850);
    }

    function reset() {
      ballWindow.classList.remove('show');
      setTimeout(() => {
        ballEight.classList.remove('hidden');
        ball.classList.remove('positive','neutral','negative');
      }, 150);
      btnConsult.disabled = false;
      btnReset.classList.remove('show');
    }

    function renderHistory() {
      if (history.length === 0) { document.getElementById('historySection').classList.remove('visible'); return; }
      document.getElementById('historySection').classList.add('visible');
      document.getElementById('historyList').innerHTML = history.map(h =>
        `<div class="history-item"><strong style="color:var(--accent)">${escHtml(h.q)}</strong><br>${escHtml(h.a)}</div>`
      ).join('');
    }

    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    btnConsult.addEventListener('click', consult);
    btnReset.addEventListener('click', reset);
    ball.addEventListener('click', () => {
      if (!ballWindow.classList.contains('show')) consult();
      else reset();
    });
    document.getElementById('questionInput').addEventListener('keydown', e => { if (e.key === 'Enter') consult(); });
    document.addEventListener('keydown', e => { if (e.key === ' ' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); ballWindow.classList.contains('show') ? reset() : consult(); } });

    document.body.style.opacity='0'; document.body.style.transition='opacity .4s ease';
    window.addEventListener('load', () => { document.body.style.opacity='1'; });
  </script>
</body>
</html>
