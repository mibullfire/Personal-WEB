<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Número Aleatorio — Miguel Toro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../img/web-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --dark: #111111;
      --dark2: #1a1a1a;
      --dark3: #222222;
      --white: #f5f5f5;
      --white2: #e0e0e0;
      --gray: #888;
      --gray2: #444;
      --accent: #ff4dab;
      --accent2: #ff1a96;
      --radius: 12px;
      --radius-lg: 16px;
      --mono: 'JetBrains Mono', 'Cascadia Code', 'Courier New', monospace;
    }

    html { font-size: 16px; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      cursor: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }
    button { cursor: none; font-family: inherit; border: none; outline: none; }

    /* ── Cursor ── */
    .cursor {
      width: 10px; height: 10px;
      background: var(--accent); border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.3s, height 0.3s;
    }
    .cursor-follower {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(255,77,171,0.4); border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, width 0.3s, height 0.3s, border-color 0.3s;
    }
    body:has(a:hover) .cursor,
    body:has(button:hover) .cursor { width: 16px; height: 16px; }
    body:has(a:hover) .cursor-follower,
    body:has(button:hover) .cursor-follower { width: 56px; height: 56px; border-color: rgba(255,77,171,0.8); }

    /* ── Navbar ── */
    .app-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 1.1rem 2.5rem;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .app-nav-logo {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 700; font-size: 0.95rem;
      letter-spacing: -0.02em; color: var(--white);
    }
    .app-nav-star { color: var(--accent); animation: spin 8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .app-nav-back {
      font-size: 0.82rem; font-weight: 600; color: var(--gray);
      padding: 0.45rem 1rem;
      border: 1px solid rgba(255,255,255,0.09); border-radius: 100px;
      transition: color 0.3s, border-color 0.3s, background 0.3s;
    }
    .app-nav-back:hover {
      color: var(--accent);
      border-color: rgba(255,77,171,0.3);
      background: rgba(255,77,171,0.05);
    }

    /* ── Layout ── */
    .tool-main {
      flex: 1;
      max-width: 700px; width: 100%;
      margin: 0 auto;
      padding: 3.5rem 2rem 5rem;
      display: flex; flex-direction: column; gap: 2rem;
    }

    /* ── Page title ── */
    .tool-header { margin-bottom: 0.5rem; }
    .tool-title-row {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;
    }
    .tool-icon {
      font-size: 2rem;
      background: rgba(255,77,171,0.08);
      border: 1px solid rgba(255,77,171,0.2);
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius);
      line-height: 1.3;
    }
    .tool-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900; letter-spacing: -0.04em;
    }
    .tool-subtitle { font-size: 0.95rem; color: var(--gray); }

    /* ── Range inputs ── */
    .range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .range-field { display: flex; flex-direction: column; gap: 0.5rem; }
    .range-label {
      font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray);
    }
    .range-input {
      background: var(--dark2);
      color: var(--white2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      font-family: var(--mono); font-size: 1.1rem;
      font-weight: 700;
      outline: none; width: 100%;
      transition: border-color 0.3s;
      -moz-appearance: textfield;
    }
    .range-input::-webkit-outer-spin-button,
    .range-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .range-input:focus { border-color: rgba(255,77,171,0.4); }

    /* ── Result display ── */
    .result-wrap {
      padding: 3rem 1rem;
      background: var(--dark);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-lg);
      text-align: center;
      position: relative; overflow: hidden;
      min-height: 200px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.5rem;
    }
    .result-wrap::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,77,171,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .result-number {
      font-family: var(--mono);
      font-size: clamp(4rem, 14vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--white);
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
      z-index: 1;
    }
    .result-number.pop {
      animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      0%   { transform: scale(0.7); opacity: 0.3; }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .result-number.rolling {
      color: var(--accent);
    }

    .result-range-hint {
      font-size: 0.82rem; color: var(--gray);
      font-family: var(--mono); z-index: 1;
    }

    .result-empty {
      font-size: 1rem; color: var(--gray2);
      z-index: 1; letter-spacing: -0.01em;
    }

    /* ── Generate button ── */
    .btn-generate {
      background: var(--accent); color: var(--black);
      border-radius: 100px;
      padding: 1rem 2.5rem;
      font-size: 1rem; font-weight: 800;
      letter-spacing: -0.02em;
      width: 100%;
      transition: background 0.3s, transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 0 0 rgba(255,77,171,0);
    }
    .btn-generate:hover {
      background: var(--accent2);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,77,171,0.25);
    }
    .btn-generate:active { transform: translateY(0); box-shadow: none; }
    .btn-generate:disabled { opacity: 0.4; pointer-events: none; }

    /* ── Copy button ── */
    .copy-row {
      display: flex; justify-content: center;
    }
    .btn-copy {
      background: transparent; color: var(--gray);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 100px;
      padding: 0.5rem 1.2rem;
      font-size: 0.82rem; font-weight: 600;
      display: none; align-items: center; gap: 0.4rem;
      transition: color 0.3s, border-color 0.3s, background 0.3s;
    }
    .btn-copy.visible { display: flex; }
    .btn-copy:hover {
      color: var(--white);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
    }

    /* ── History ── */
    .history-section { display: none; flex-direction: column; gap: 0.6rem; }
    .history-section.visible { display: flex; }
    .history-label {
      font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray);
      display: flex; align-items: center; justify-content: space-between;
    }
    .btn-clear-history {
      background: none; color: var(--gray);
      font-size: 0.75rem; font-weight: 600;
      padding: 0.2rem 0.5rem;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 100px;
      transition: color 0.3s, border-color 0.3s;
    }
    .btn-clear-history:hover { color: var(--accent); border-color: rgba(255,77,171,0.3); }

    .history-list {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
    }
    .history-chip {
      font-family: var(--mono); font-size: 0.88rem; font-weight: 500;
      padding: 0.4rem 0.85rem;
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 100px;
      color: var(--white2);
      animation: chipIn 0.2s ease;
    }
    .history-chip:first-child {
      border-color: rgba(255,77,171,0.3);
      color: var(--accent);
    }
    @keyframes chipIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--accent); color: var(--black);
      padding: 0.55rem 1.4rem; border-radius: 100px;
      font-size: 0.85rem; font-weight: 700;
      opacity: 0; pointer-events: none; z-index: 1000;
      white-space: nowrap;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Footer ── */
    .app-footer {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 1.4rem 2.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.8rem; color: var(--gray);
    }
    .app-footer a { color: var(--gray); font-weight: 600; transition: color 0.3s; }
    .app-footer a:hover { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .app-nav { padding: 1rem 1.2rem; }
      .tool-main { padding: 2.5rem 1.2rem 4rem; }
      .range-row { grid-template-columns: 1fr; }
      .app-footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <nav class="app-nav">
    <a href="../index.html" class="app-nav-logo">
      <span class="app-nav-star">✦</span>
      <span>Miguel Toro</span>
    </a>
    <a href="../aplicaciones.html" class="app-nav-back">← Aplicaciones</a>
  </nav>

  <main class="tool-main">

    <div class="tool-header">
      <div class="tool-title-row">
        <span class="tool-icon">?</span>
        <h1 class="tool-title">Aleatorio</h1>
      </div>
      <p class="tool-subtitle">Genera un número al azar entre los valores que elijas.</p>
    </div>

    <!-- Range inputs -->
    <div class="range-row">
      <div class="range-field">
        <span class="range-label">Mínimo</span>
        <input type="number" id="minInput" class="range-input" value="0" />
      </div>
      <div class="range-field">
        <span class="range-label">Máximo</span>
        <input type="number" id="maxInput" class="range-input" value="100" />
      </div>
    </div>

    <!-- Result -->
    <div class="result-wrap" id="resultWrap">
      <span class="result-empty" id="resultEmpty">Pulsa generar</span>
      <span class="result-number" id="resultNumber" style="display:none"></span>
      <span class="result-range-hint" id="resultHint" style="display:none"></span>
    </div>

    <!-- Copy -->
    <div class="copy-row">
      <button class="btn-copy" id="btnCopy">Copiar número</button>
    </div>

    <!-- Generate -->
    <button class="btn-generate" id="btnGenerate">Generar</button>

    <!-- History -->
    <div class="history-section" id="historySection">
      <div class="history-label">
        <span>Historial</span>
        <button class="btn-clear-history" id="btnClearHistory">Limpiar</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

  </main>

  <div id="toast" class="toast"></div>

  <footer class="app-footer">
    <span>✦ Número Aleatorio</span>
    <a href="../aplicaciones.html">← Todas las apps</a>
  </footer>

  <script>
    /* ── Cursor ── */
    const cur = document.getElementById('cursor');
    const fol = document.getElementById('cursorFollower');
    let mx = 0, my = 0, fx = 0, fy = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cur.style.left = mx + 'px'; cur.style.top = my + 'px';
    });
    (function loop() {
      fx += (mx - fx) * 0.12; fy += (my - fy) * 0.12;
      fol.style.left = fx + 'px'; fol.style.top = fy + 'px';
      requestAnimationFrame(loop);
    })();

    /* ── Toast ── */
    function showToast(msg, ms = 2000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    /* ── State ── */
    const minInput = document.getElementById('minInput');
    const maxInput = document.getElementById('maxInput');
    const resultEmpty = document.getElementById('resultEmpty');
    const resultNumber = document.getElementById('resultNumber');
    const resultHint = document.getElementById('resultHint');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnCopy = document.getElementById('btnCopy');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');
    const btnClearHistory = document.getElementById('btnClearHistory');

    let currentNumber = null;
    let history = [];
    let rolling = false;

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generate() {
      const min = parseInt(minInput.value, 10);
      const max = parseInt(maxInput.value, 10);

      if (isNaN(min) || isNaN(max)) { showToast('Introduce valores válidos.'); return; }
      if (min > max) { showToast('El mínimo no puede ser mayor que el máximo.'); return; }
      if (rolling) return;

      rolling = true;
      btnGenerate.disabled = true;

      /* Rolling animation — flicker through random numbers */
      let ticks = 0;
      const maxTicks = 14;
      resultEmpty.style.display = 'none';
      resultNumber.style.display = 'block';
      resultHint.style.display = 'none';
      resultNumber.classList.remove('pop');
      resultNumber.classList.add('rolling');

      function tick() {
        resultNumber.textContent = randInt(min, max);
        ticks++;
        if (ticks < maxTicks) {
          setTimeout(tick, 30 + ticks * 8);
        } else {
          const final = randInt(min, max);
          resultNumber.textContent = final;
          resultNumber.classList.remove('rolling');
          void resultNumber.offsetWidth;
          resultNumber.classList.add('pop');

          resultHint.textContent = `[${min} – ${max}]`;
          resultHint.style.display = 'block';

          currentNumber = final;
          btnCopy.classList.add('visible');
          addToHistory(final);

          rolling = false;
          btnGenerate.disabled = false;
        }
      }
      tick();
    }

    function addToHistory(n) {
      history.unshift(n);
      if (history.length > 20) history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historySection.classList.remove('visible');
        return;
      }
      historySection.classList.add('visible');
      historyList.innerHTML = history.map(n =>
        `<span class="history-chip">${n}</span>`
      ).join('');
    }

    btnGenerate.addEventListener('click', generate);

    /* Generate on Enter key inside inputs */
    [minInput, maxInput].forEach(inp => {
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
    });

    /* Spacebar to generate */
    document.addEventListener('keydown', e => {
      if (e.key === ' ' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        generate();
      }
    });

    btnCopy.addEventListener('click', () => {
      if (currentNumber === null) return;
      navigator.clipboard.writeText(String(currentNumber))
        .then(() => showToast('Copiado al portapapeles.'))
        .catch(() => showToast('No se pudo copiar.'));
    });

    btnClearHistory.addEventListener('click', () => {
      history = [];
      renderHistory();
    });

    /* ── Page fade in ── */
    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.4s ease';
    window.addEventListener('load', () => { document.body.style.opacity = '1'; });
  </script>
</body>
</html>
