<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo — Miguel Toro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../img/web-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a; --dark: #111111; --dark2: #1a1a1a; --dark3: #222;
      --white: #f5f5f5; --white2: #e0e0e0; --gray: #888; --gray2: #444;
      --accent: #ff4dab; --accent2: #ff1a96; --radius: 12px; --radius-lg: 16px;
    }
    html { font-size: 16px; }
    body { background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; overflow-x: hidden; cursor: none; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    button { cursor: none; font-family: inherit; border: none; outline: none; }

    .cursor { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width .3s, height .3s; }
    .cursor-follower { width: 36px; height: 36px; border: 1.5px solid rgba(255,77,171,.4); border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: transform .15s ease, width .3s, height .3s, border-color .3s; }
    body:has(a:hover) .cursor, body:has(button:hover) .cursor { width: 16px; height: 16px; }
    body:has(a:hover) .cursor-follower, body:has(button:hover) .cursor-follower { width: 56px; height: 56px; border-color: rgba(255,77,171,.8); }
    @media (pointer: coarse) { body { cursor: auto; } button { cursor: auto; } .cursor, .cursor-follower { display: none; } }

    .app-nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2.5rem; background: rgba(10,10,10,.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,.06); }
    .app-nav-logo { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: .95rem; letter-spacing: -.02em; }
    .app-nav-star { color: var(--accent); animation: spin 8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .app-nav-back { font-size: .82rem; font-weight: 600; color: var(--gray); padding: .45rem 1rem; border: 1px solid rgba(255,255,255,.09); border-radius: 100px; transition: color .3s, border-color .3s, background .3s; }
    .app-nav-back:hover { color: var(--accent); border-color: rgba(255,77,171,.3); background: rgba(255,77,171,.05); }

    .tool-main { flex: 1; max-width: 860px; width: 100%; margin: 0 auto; padding: 3rem 2rem 5rem; display: flex; flex-direction: column; gap: 2rem; }
    .tool-title-row { display: flex; align-items: center; gap: 1rem; margin-bottom: .4rem; }
    .tool-icon { font-size: 1.8rem; background: rgba(255,77,171,.08); border: 1px solid rgba(255,77,171,.2); padding: .3rem .65rem; border-radius: var(--radius); line-height: 1.3; }
    .tool-title { font-size: clamp(1.6rem,4vw,2.4rem); font-weight: 900; letter-spacing: -.04em; }
    .tool-subtitle { font-size: .92rem; color: var(--gray); }

    /* ── Mode selector ── */
    .mode-row { display: flex; background: var(--dark2); border: 1px solid rgba(255,255,255,.07); border-radius: 100px; padding: .3rem; gap: .2rem; width: fit-content; }
    .mode-btn { padding: .5rem 1.3rem; border-radius: 100px; font-size: .82rem; font-weight: 600; color: var(--gray); background: transparent; transition: background .3s, color .3s; }
    .mode-btn.active { background: var(--accent); color: var(--black); }
    .mode-btn:not(.active):hover { color: var(--white); }

    /* ── Ball display ── */
    .ball-display {
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      background: var(--dark); border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--radius-lg); padding: 2rem 1rem;
      position: relative; overflow: hidden;
    }
    .ball-display::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,77,171,.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .ball-current {
      width: 110px; height: 110px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3c3c3c 0%, #181818 40%, #000 70%);
      box-shadow: inset -4px -6px 14px rgba(0,0,0,.9), inset 3px 3px 8px rgba(255,255,255,.04), 0 10px 40px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.04);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; z-index: 1;
    }
    .ball-current::before {
      content: ''; position: absolute; top: 10%; left: 15%; width: 35%; height: 22%;
      background: radial-gradient(ellipse, rgba(255,255,255,.12) 0%, transparent 70%);
      border-radius: 50%; transform: rotate(-20deg);
    }
    .ball-current-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2rem, 6vw, 3rem); font-weight: 700;
      color: #fff; line-height: 1; z-index: 1;
    }
    .ball-empty-text { font-size: .9rem; color: var(--gray2); }
    @keyframes ballPop {
      0%   { transform: scale(0.4); opacity: 0; }
      60%  { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }
    .ball-current.pop { animation: ballPop .45s cubic-bezier(.34,1.56,.64,1); }

    .ball-meta { font-size: .85rem; color: var(--gray); z-index: 1; }
    .balls-remaining { font-size: .78rem; font-weight: 600; color: var(--gray2); z-index: 1; }

    /* ── Last called ── */
    .last-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .last-label { font-size: .73rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--gray); white-space: nowrap; }
    .last-chips { display: flex; gap: .35rem; flex-wrap: wrap; overflow: hidden; max-height: 2.6rem; }
    .last-chip {
      font-family: 'JetBrains Mono', monospace; font-size: .78rem; font-weight: 700;
      padding: .25rem .55rem; background: var(--dark2); border: 1px solid rgba(255,255,255,.08);
      border-radius: 100px; color: var(--white2); animation: chipIn .2s ease;
    }
    .last-chip:first-child { border-color: rgba(255,77,171,.4); color: var(--accent); }
    @keyframes chipIn { from { opacity:0; transform: scale(.8); } to { opacity:1; transform: scale(1); } }

    /* ── Buttons ── */
    .btn-next { background: var(--accent); color: var(--black); border-radius: 100px; padding: 1rem 2.5rem; font-size: 1rem; font-weight: 800; letter-spacing: -.02em; width: 100%; transition: background .3s, transform .15s, box-shadow .3s; }
    .btn-next:hover { background: var(--accent2); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,77,171,.25); }
    .btn-next:active { transform: translateY(0); }
    .btn-next:disabled { opacity: .4; pointer-events: none; }
    .btn-reset { background: transparent; color: var(--gray); border: 1px solid rgba(255,255,255,.09); border-radius: 100px; padding: .6rem 1.4rem; font-size: .83rem; font-weight: 600; transition: color .3s, border-color .3s; display: block; margin: 0 auto; }
    .btn-reset:hover { color: var(--white); border-color: rgba(255,255,255,.2); }

    /* ── Number grid ── */
    .grid-section { display: flex; flex-direction: column; gap: .6rem; }
    .grid-label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--gray); }
    .num-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }
    .num-cell {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: clamp(.55rem, 1.5vw, .8rem); font-weight: 700;
      border-radius: 6px;
      background: var(--dark2); border: 1px solid rgba(255,255,255,.05);
      color: var(--gray2);
      transition: background .25s, color .25s, border-color .25s, transform .2s;
    }
    .num-cell.called {
      background: var(--accent);
      border-color: var(--accent2);
      color: var(--black);
      transform: scale(1.05);
    }
    .num-cell.latest {
      box-shadow: 0 0 0 2px #fff, 0 0 12px rgba(255,77,171,.6);
    }

    /* ── Bingo! ── */
    .bingo-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
      z-index: 200; align-items: center; justify-content: center;
      flex-direction: column; gap: 1.5rem;
    }
    .bingo-overlay.show { display: flex; }
    .bingo-text {
      font-family: 'Inter', sans-serif; font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 900; letter-spacing: -.05em; color: var(--accent);
      animation: bingoPop 0.6s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes bingoPop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .bingo-sub { font-size: 1.1rem; color: var(--white2); text-align: center; }
    .btn-bingo-reset { background: var(--accent); color: var(--black); border-radius: 100px; padding: .9rem 2.2rem; font-size: .95rem; font-weight: 800; transition: background .3s; }
    .btn-bingo-reset:hover { background: var(--accent2); }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--accent); color: var(--black); padding: .55rem 1.4rem; border-radius: 100px; font-size: .85rem; font-weight: 700; opacity: 0; pointer-events: none; z-index: 1000; white-space: nowrap; transition: opacity .25s, transform .25s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .app-footer { display: flex; align-items: center; justify-content: space-between; padding: 1.4rem 2.5rem; border-top: 1px solid rgba(255,255,255,.06); font-size: .8rem; color: var(--gray); }
    .app-footer a { color: var(--gray); font-weight: 600; transition: color .3s; }
    .app-footer a:hover { color: var(--accent); }

    @media (max-width: 600px) { .app-nav { padding: 1rem 1.2rem; } .tool-main { padding: 2rem 1.2rem 4rem; } .num-grid { grid-template-columns: repeat(9, 1fr); } .app-footer { flex-direction: column; gap: .5rem; text-align: center; padding: 1.2rem; } }
  </style>
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <nav class="app-nav">
    <a href="../index.html" class="app-nav-logo"><span class="app-nav-star">✦</span><span>Miguel Toro</span></a>
    <a href="../aplicaciones.html" class="app-nav-back">← Aplicaciones</a>
  </nav>

  <main class="tool-main">
    <div>
      <div class="tool-title-row"><span class="tool-icon">🎡</span><h1 class="tool-title">Bingo</h1></div>
      <p class="tool-subtitle">Saca bolas al azar, sin repetición. ¡Bingo!</p>
    </div>

    <!-- Mode -->
    <div class="mode-row">
      <button class="mode-btn active" data-max="90">Bingo 90</button>
      <button class="mode-btn" data-max="75">Bingo 75</button>
    </div>

    <!-- Ball display -->
    <div class="ball-display">
      <div class="ball-current" id="ballCurrent">
        <span class="ball-empty-text" id="ballEmptyText">—</span>
        <span class="ball-current-num" id="ballNum" style="display:none"></span>
      </div>
      <p class="ball-meta" id="ballMeta">Pulsa el botón para sacar la primera bola</p>
      <p class="balls-remaining" id="ballsRemaining"></p>
    </div>

    <!-- Last called -->
    <div class="last-row" id="lastRow" style="display:none">
      <span class="last-label">Última:</span>
      <div class="last-chips" id="lastChips"></div>
    </div>

    <!-- Button -->
    <button class="btn-next" id="btnNext">Sacar bola</button>
    <button class="btn-reset" id="btnReset">Nueva partida</button>

    <!-- Grid -->
    <div class="grid-section">
      <span class="grid-label" id="gridLabel">Números (1–90)</span>
      <div class="num-grid" id="numGrid"></div>
    </div>
  </main>

  <!-- Bingo overlay -->
  <div class="bingo-overlay" id="bingoOverlay">
    <div class="bingo-text">¡BINGO!</div>
    <p class="bingo-sub">Se han sacado todos los números.<br />¡Espero que alguien lo haya cantado!</p>
    <button class="btn-bingo-reset" id="btnBingoReset">Nueva partida</button>
  </div>

  <div id="toast" class="toast"></div>

  <footer class="app-footer">
    <span>✦ Bingo</span>
    <a href="../aplicaciones.html">← Todas las apps</a>
  </footer>

  <script>
    const cur = document.getElementById('cursor'), fol = document.getElementById('cursorFollower');
    let mx=0,my=0,fx=0,fy=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cur.style.left=mx+'px'; cur.style.top=my+'px'; });
    (function loop(){ fx+=(mx-fx)*.12; fy+=(my-fy)*.12; fol.style.left=fx+'px'; fol.style.top=fy+'px'; requestAnimationFrame(loop); })();

    function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

    let MAX = 90;
    let bag = [];
    let called = [];
    let drawing = false;

    const ballCurrent = document.getElementById('ballCurrent');
    const ballNum     = document.getElementById('ballNum');
    const ballEmptyText = document.getElementById('ballEmptyText');
    const ballMeta    = document.getElementById('ballMeta');
    const ballsRem    = document.getElementById('ballsRemaining');
    const btnNext     = document.getElementById('btnNext');
    const lastRow     = document.getElementById('lastRow');
    const lastChips   = document.getElementById('lastChips');
    const numGrid     = document.getElementById('numGrid');
    const bingoOverlay = document.getElementById('bingoOverlay');

    function init() {
      bag = Array.from({length: MAX}, (_,i) => i+1);
      shuffle(bag);
      called = [];
      buildGrid();
      ballNum.style.display = 'none';
      ballEmptyText.style.display = 'block';
      ballEmptyText.textContent = '—';
      ballMeta.textContent = 'Pulsa el botón para sacar la primera bola';
      ballsRem.textContent = '';
      lastRow.style.display = 'none';
      lastChips.innerHTML = '';
      btnNext.disabled = false;
      ballCurrent.classList.remove('pop');
      bingoOverlay.classList.remove('show');
      document.getElementById('gridLabel').textContent = `Números (1–${MAX})`;
    }

    function shuffle(arr) {
      for (let i = arr.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
      }
    }

    function buildGrid() {
      numGrid.innerHTML = '';
      // Adapt columns
      numGrid.style.gridTemplateColumns = MAX === 90 ? 'repeat(10, 1fr)' : 'repeat(15, 1fr)';
      for (let i = 1; i <= MAX; i++) {
        const cell = document.createElement('div');
        cell.className = 'num-cell';
        cell.id = 'cell-' + i;
        cell.textContent = i;
        numGrid.appendChild(cell);
      }
    }

    function draw() {
      if (drawing || bag.length === 0) return;
      drawing = true;
      btnNext.disabled = true;

      // Remove latest highlight from prev
      document.querySelectorAll('.num-cell.latest').forEach(c => c.classList.remove('latest'));

      const n = bag.pop();
      called.push(n);

      // Animate ball
      ballEmptyText.style.display = 'none';
      ballNum.style.display = 'block';
      ballNum.textContent = n;
      ballCurrent.classList.remove('pop');
      void ballCurrent.offsetWidth;
      ballCurrent.classList.add('pop');

      ballMeta.textContent = `Bola número ${called.length}`;
      ballsRem.textContent = bag.length > 0 ? `Quedan ${bag.length} bolas` : '¡Última bola!';

      // Mark grid
      const cell = document.getElementById('cell-' + n);
      if (cell) { cell.classList.add('called', 'latest'); }

      // Last called chips (max 8 visible)
      lastRow.style.display = 'flex';
      const recentCalled = [...called].reverse().slice(0, 10);
      lastChips.innerHTML = recentCalled.map((num, i) =>
        `<span class="last-chip">${num}</span>`
      ).join('');

      drawing = false;
      if (bag.length > 0) {
        btnNext.disabled = false;
      } else {
        // All done
        setTimeout(() => { bingoOverlay.classList.add('show'); }, 600);
      }
    }

    btnNext.addEventListener('click', draw);
    document.getElementById('btnReset').addEventListener('click', init);
    document.getElementById('btnBingoReset').addEventListener('click', init);

    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        MAX = parseInt(btn.dataset.max);
        init();
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key === ' ' && !btnNext.disabled) { e.preventDefault(); draw(); }
    });

    init();

    document.body.style.opacity = '0'; document.body.style.transition = 'opacity .4s ease';
    window.addEventListener('load', () => { document.body.style.opacity = '1'; });
  </script>
</body>
</html>
