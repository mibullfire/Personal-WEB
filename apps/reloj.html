<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reloj de Herramientas — Miguel Toro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../img/web-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --dark: #111111;
      --dark2: #1a1a1a;
      --dark3: #222222;
      --white: #f5f5f5;
      --white2: #e0e0e0;
      --gray: #888;
      --gray2: #444;
      --accent: #ff4dab;
      --accent2: #ff1a96;
      --radius: 12px;
      --radius-lg: 16px;
      --mono: 'JetBrains Mono', 'Cascadia Code', 'Courier New', monospace;
    }

    html { font-size: 16px; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      cursor: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }
    button { cursor: none; font-family: inherit; border: none; outline: none; }

    /* ── Cursor ── */
    .cursor {
      width: 10px; height: 10px;
      background: var(--accent); border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.3s, height 0.3s;
    }
    .cursor-follower {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(255,77,171,0.4); border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, width 0.3s, height 0.3s, border-color 0.3s;
    }
    body:has(a:hover) .cursor,
    body:has(button:hover) .cursor { width: 16px; height: 16px; }
    body:has(a:hover) .cursor-follower,
    body:has(button:hover) .cursor-follower { width: 56px; height: 56px; border-color: rgba(255,77,171,0.8); }

    /* ── Navbar ── */
    .app-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 1.1rem 2.5rem;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .app-nav-logo {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 700; font-size: 0.95rem;
      letter-spacing: -0.02em; color: var(--white);
    }
    .app-nav-star { color: var(--accent); animation: spin 8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .app-nav-back {
      font-size: 0.82rem; font-weight: 600; color: var(--gray);
      padding: 0.45rem 1rem;
      border: 1px solid rgba(255,255,255,0.09); border-radius: 100px;
      transition: color 0.3s, border-color 0.3s, background 0.3s;
    }
    .app-nav-back:hover {
      color: var(--accent);
      border-color: rgba(255,77,171,0.3);
      background: rgba(255,77,171,0.05);
    }

    /* ── Layout ── */
    .tool-main {
      flex: 1;
      max-width: 700px; width: 100%;
      margin: 0 auto;
      padding: 3.5rem 2rem 5rem;
      display: flex; flex-direction: column; gap: 2rem;
    }

    /* ── Page title ── */
    .tool-header { margin-bottom: 0.5rem; }
    .tool-title-row {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;
    }
    .tool-icon {
      font-size: 2rem;
      background: rgba(255,77,171,0.08);
      border: 1px solid rgba(255,77,171,0.2);
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius);
      line-height: 1.3;
    }
    .tool-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900; letter-spacing: -0.04em;
    }
    .tool-subtitle { font-size: 0.95rem; color: var(--gray); }

    /* ── Tab switcher ── */
    .tab-bar {
      display: flex;
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 100px;
      padding: 0.3rem;
      gap: 0.2rem;
      width: fit-content;
    }
    .tab-btn {
      padding: 0.55rem 1.4rem;
      border-radius: 100px;
      font-size: 0.85rem; font-weight: 600;
      color: var(--gray);
      background: transparent;
      transition: background 0.3s, color 0.3s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: var(--black);
    }
    .tab-btn:not(.active):hover { color: var(--white); }

    /* ── Panel ── */
    .panel { display: none; flex-direction: column; gap: 2rem; }
    .panel.active { display: flex; }

    /* ── Stopwatch display ── */
    .sw-display-wrap {
      text-align: center;
      padding: 2.5rem 1rem;
      background: var(--dark);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
    }
    .sw-display-wrap::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,77,171,0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    .sw-time {
      font-family: var(--mono);
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--white);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }
    .sw-time.running { color: var(--white); }
    .sw-time.paused { color: var(--gray); }

    .sw-ms {
      font-size: clamp(1.5rem, 5vw, 2.8rem);
      color: var(--accent);
    }

    /* ── Controls ── */
    .sw-controls {
      display: flex; gap: 0.8rem;
      justify-content: center; flex-wrap: wrap;
    }

    .btn-start {
      background: var(--accent); color: var(--black);
      border-radius: 100px;
      padding: 0.7rem 2rem;
      font-size: 0.9rem; font-weight: 700;
      min-width: 120px;
      transition: background 0.3s, transform 0.15s;
    }
    .btn-start:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-start:active { transform: translateY(0); }

    .btn-secondary {
      background: transparent; color: var(--white2);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 0.65rem 1.4rem;
      font-size: 0.85rem; font-weight: 600;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.2);
    }
    .btn-secondary:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── Laps ── */
    .laps-section { display: none; flex-direction: column; gap: 0.6rem; }
    .laps-section.visible { display: flex; }
    .laps-label {
      font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray);
    }
    .laps-list {
      display: flex; flex-direction: column; gap: 0.4rem;
      max-height: 240px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--gray2) transparent;
    }
    .lap-row {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1rem;
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: var(--radius);
      font-family: var(--mono); font-size: 0.88rem;
      animation: lapIn 0.25s ease;
    }
    @keyframes lapIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .lap-n { color: var(--gray); font-size: 0.75rem; }
    .lap-split { color: var(--white2); }
    .lap-total { color: var(--gray); font-size: 0.78rem; }
    .lap-row.lap-best .lap-split { color: var(--accent); }

    /* ── Countdown ── */
    .cd-input-section {
      display: flex; flex-direction: column; gap: 0.8rem;
    }
    .cd-input-label {
      font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray);
    }
    .cd-input-row { display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .cd-datetime {
      flex: 1;
      background: var(--dark2);
      color: var(--white2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-family: 'Inter', sans-serif; font-size: 0.95rem;
      outline: none; min-width: 0;
      color-scheme: dark;
      transition: border-color 0.3s;
    }
    .cd-datetime:focus { border-color: rgba(255,77,171,0.4); }

    .btn-set {
      background: var(--accent); color: var(--black);
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      font-size: 0.88rem; font-weight: 700;
      white-space: nowrap;
      transition: background 0.3s, transform 0.15s;
    }
    .btn-set:hover { background: var(--accent2); transform: translateY(-1px); }

    /* ── Countdown display ── */
    .cd-display-wrap {
      padding: 2.5rem 1rem;
      background: var(--dark);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-lg);
      text-align: center;
      position: relative; overflow: hidden;
    }
    .cd-display-wrap::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,77,171,0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    .cd-units {
      display: flex; align-items: flex-end;
      justify-content: center; gap: 0;
    }
    .cd-unit { display: flex; flex-direction: column; align-items: center; padding: 0 0.8rem; }
    .cd-value {
      font-family: var(--mono);
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 700;
      line-height: 1;
      color: var(--white);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }
    .cd-label {
      font-size: 0.65rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--gray); margin-top: 0.4rem;
    }
    .cd-sep {
      font-family: var(--mono);
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 300;
      color: var(--gray2);
      line-height: 1;
      padding-bottom: 0.1em;
      align-self: flex-end;
    }

    /* Finished state */
    .cd-display-wrap.finished .cd-value { color: var(--accent); }
    .cd-finished-msg {
      display: none;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      color: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .cd-display-wrap.finished .cd-units { display: none; }
    .cd-display-wrap.finished .cd-finished-msg { display: block; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.97); }
    }

    .cd-target-info {
      font-size: 0.8rem; color: var(--gray);
      margin-top: 1rem; display: none;
    }
    .cd-target-info.visible { display: block; }

    .cd-controls { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--accent); color: var(--black);
      padding: 0.55rem 1.4rem; border-radius: 100px;
      font-size: 0.85rem; font-weight: 700;
      opacity: 0; pointer-events: none; z-index: 1000;
      white-space: nowrap;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Footer ── */
    .app-footer {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 1.4rem 2.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.8rem; color: var(--gray);
    }
    .app-footer a { color: var(--gray); font-weight: 600; transition: color 0.3s; }
    .app-footer a:hover { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .app-nav { padding: 1rem 1.2rem; }
      .tool-main { padding: 2.5rem 1.2rem 4rem; }
      .cd-unit { padding: 0 0.4rem; }
      .cd-sep { font-size: 2rem; }
      .app-footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <nav class="app-nav">
    <a href="../index.html" class="app-nav-logo">
      <span class="app-nav-star">✦</span>
      <span>Miguel Toro</span>
    </a>
    <a href="../aplicaciones.html" class="app-nav-back">← Aplicaciones</a>
  </nav>

  <main class="tool-main">

    <!-- Header -->
    <div class="tool-header">
      <div class="tool-title-row">
        <span class="tool-icon">◷</span>
        <h1 class="tool-title">Reloj de Herramientas</h1>
      </div>
      <p class="tool-subtitle">Cronómetro y cuenta atrás en una sola pantalla.</p>
    </div>

    <!-- Tab switcher -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="sw">Cronómetro</button>
      <button class="tab-btn" data-tab="cd">Cuenta atrás</button>
    </div>

    <!-- ══ CRONÓMETRO ══ -->
    <div id="swPanel" class="panel active">

      <div class="sw-display-wrap">
        <div class="sw-time" id="swDisplay">
          <span id="swHMS">00:00:00</span><span class="sw-ms">.<span id="swTenths">0</span></span>
        </div>
      </div>

      <div class="sw-controls">
        <button id="swStartBtn" class="btn-start">Iniciar</button>
        <button id="swLapBtn" class="btn-secondary" disabled>Vuelta</button>
        <button id="swResetBtn" class="btn-secondary" disabled>Reiniciar</button>
      </div>

      <div id="lapsSection" class="laps-section">
        <span class="laps-label">Vueltas</span>
        <div id="lapsList" class="laps-list"></div>
      </div>

    </div>

    <!-- ══ CUENTA ATRÁS ══ -->
    <div id="cdPanel" class="panel">

      <div class="cd-input-section">
        <span class="cd-input-label">¿Hasta cuándo?</span>
        <div class="cd-input-row">
          <input type="datetime-local" id="cdInput" class="cd-datetime" />
          <button id="cdSetBtn" class="btn-set">Establecer</button>
        </div>
      </div>

      <div class="cd-display-wrap" id="cdDisplayWrap">
        <div class="cd-units">
          <div class="cd-unit">
            <div class="cd-value" id="cdDays">00</div>
            <div class="cd-label">días</div>
          </div>
          <div class="cd-sep">:</div>
          <div class="cd-unit">
            <div class="cd-value" id="cdHours">00</div>
            <div class="cd-label">horas</div>
          </div>
          <div class="cd-sep">:</div>
          <div class="cd-unit">
            <div class="cd-value" id="cdMinutes">00</div>
            <div class="cd-label">min</div>
          </div>
          <div class="cd-sep">:</div>
          <div class="cd-unit">
            <div class="cd-value" id="cdSeconds">00</div>
            <div class="cd-label">seg</div>
          </div>
        </div>
        <div class="cd-finished-msg">¡Tiempo!</div>
        <p class="cd-target-info" id="cdTargetInfo"></p>
      </div>

      <div class="cd-controls">
        <button id="cdResetBtn" class="btn-secondary" style="display:none">Nueva cuenta atrás</button>
      </div>

    </div>

  </main>

  <div id="toast" class="toast"></div>

  <footer class="app-footer">
    <span>✦ Reloj de Herramientas</span>
    <a href="../aplicaciones.html">← Todas las apps</a>
  </footer>

  <script>
    /* ── Custom cursor ── */
    const cur = document.getElementById('cursor');
    const fol = document.getElementById('cursorFollower');
    let mx = 0, my = 0, fx = 0, fy = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cur.style.left = mx + 'px'; cur.style.top = my + 'px';
    });
    (function loop() {
      fx += (mx - fx) * 0.12; fy += (my - fy) * 0.12;
      fol.style.left = fx + 'px'; fol.style.top = fy + 'px';
      requestAnimationFrame(loop);
    })();

    /* ── Toast ── */
    function showToast(msg, ms = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    /* ── Tabs ── */
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab + 'Panel').classList.add('active');
      });
    });

    /* ════════════════════
       CRONÓMETRO
    ════════════════════ */
    const swHMS = document.getElementById('swHMS');
    const swTenths = document.getElementById('swTenths');
    const swDisplay = document.getElementById('swDisplay');
    const swStartBtn = document.getElementById('swStartBtn');
    const swLapBtn = document.getElementById('swLapBtn');
    const swResetBtn = document.getElementById('swResetBtn');
    const lapsSection = document.getElementById('lapsSection');
    const lapsList = document.getElementById('lapsList');

    let swRunning = false;
    let swElapsed = 0;     // ms total
    let swStart = null;    // timestamp when last started
    let swAnimId = null;
    let laps = [];
    let lastLapAt = 0;

    function pad(n, len = 2) { return String(n).padStart(len, '0'); }

    function formatHMS(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${pad(h)}:${pad(m)}:${pad(sec)}`;
    }

    function formatTenths(ms) {
      return String(Math.floor(ms / 100) % 10);
    }

    function renderSW(ms) {
      swHMS.textContent = formatHMS(ms);
      swTenths.textContent = formatTenths(ms);
    }

    function swTick() {
      if (!swRunning) return;
      swElapsed = Date.now() - swStart;
      renderSW(swElapsed);
      swAnimId = requestAnimationFrame(swTick);
    }

    swStartBtn.addEventListener('click', () => {
      if (!swRunning) {
        swRunning = true;
        swStart = Date.now() - swElapsed;
        swDisplay.classList.remove('paused');
        swDisplay.classList.add('running');
        swStartBtn.textContent = 'Detener';
        swLapBtn.disabled = false;
        swResetBtn.disabled = false;
        swTick();
      } else {
        swRunning = false;
        swElapsed = Date.now() - swStart;
        cancelAnimationFrame(swAnimId);
        swDisplay.classList.remove('running');
        swDisplay.classList.add('paused');
        swStartBtn.textContent = 'Continuar';
      }
    });

    swLapBtn.addEventListener('click', () => {
      if (!swRunning && swElapsed === 0) return;
      const split = swElapsed - lastLapAt;
      lastLapAt = swElapsed;
      laps.unshift({ n: laps.length + 1, split, total: swElapsed });
      renderLaps();
    });

    swResetBtn.addEventListener('click', () => {
      swRunning = false;
      cancelAnimationFrame(swAnimId);
      swElapsed = 0; swStart = null; lastLapAt = 0;
      laps = [];
      renderSW(0);
      swDisplay.classList.remove('running', 'paused');
      swStartBtn.textContent = 'Iniciar';
      swLapBtn.disabled = true;
      swResetBtn.disabled = true;
      lapsSection.classList.remove('visible');
      lapsList.innerHTML = '';
    });

    function renderLaps() {
      if (laps.length === 0) { lapsSection.classList.remove('visible'); return; }
      lapsSection.classList.add('visible');

      const bestSplit = Math.min(...laps.map(l => l.split));

      lapsList.innerHTML = laps.map(l => {
        const isBest = l.split === bestSplit && laps.length > 1;
        const splitStr = formatHMS(l.split) + '.' + formatTenths(l.split);
        const totalStr = formatHMS(l.total) + '.' + formatTenths(l.total);
        return `<div class="lap-row${isBest ? ' lap-best' : ''}">
          <span class="lap-n">#${pad(l.n)}</span>
          <span class="lap-split">${splitStr}</span>
          <span class="lap-total">${totalStr}</span>
        </div>`;
      }).join('');
    }

    /* ════════════════════
       CUENTA ATRÁS
    ════════════════════ */
    const cdInput = document.getElementById('cdInput');
    const cdSetBtn = document.getElementById('cdSetBtn');
    const cdResetBtn = document.getElementById('cdResetBtn');
    const cdDays = document.getElementById('cdDays');
    const cdHours = document.getElementById('cdHours');
    const cdMinutes = document.getElementById('cdMinutes');
    const cdSeconds = document.getElementById('cdSeconds');
    const cdDisplayWrap = document.getElementById('cdDisplayWrap');
    const cdTargetInfo = document.getElementById('cdTargetInfo');

    let cdTarget = null;
    let cdInterval = null;

    /* Prefill with a sensible default: next even hour */
    (function prefillDatetime() {
      const d = new Date();
      d.setHours(d.getHours() + 1, 0, 0, 0);
      const local = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      cdInput.value = local;
    })();

    function padCd(n) { return String(n).padStart(2, '0'); }

    function updateCountdown() {
      const now = Date.now();
      const diff = cdTarget - now;

      if (diff <= 0) {
        clearInterval(cdInterval); cdInterval = null;
        cdDays.textContent = '00'; cdHours.textContent = '00';
        cdMinutes.textContent = '00'; cdSeconds.textContent = '00';
        cdDisplayWrap.classList.add('finished');
        cdResetBtn.style.display = 'inline-flex';
        cdTargetInfo.classList.remove('visible');
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);

      cdDays.textContent = padCd(days);
      cdHours.textContent = padCd(hours);
      cdMinutes.textContent = padCd(mins);
      cdSeconds.textContent = padCd(secs);
    }

    cdSetBtn.addEventListener('click', () => {
      const val = cdInput.value;
      if (!val) { showToast('Elige una fecha y hora.'); return; }

      const target = new Date(val).getTime();
      if (isNaN(target)) { showToast('Fecha no válida.'); return; }
      if (target <= Date.now()) { showToast('La fecha debe ser en el futuro.'); return; }

      if (cdInterval) { clearInterval(cdInterval); }
      cdTarget = target;
      cdDisplayWrap.classList.remove('finished');
      cdResetBtn.style.display = 'none';

      const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      cdTargetInfo.textContent = 'Hasta: ' + new Date(target).toLocaleDateString('es-ES', opts);
      cdTargetInfo.classList.add('visible');

      updateCountdown();
      cdInterval = setInterval(updateCountdown, 1000);
    });

    cdResetBtn.addEventListener('click', () => {
      if (cdInterval) { clearInterval(cdInterval); cdInterval = null; }
      cdTarget = null;
      cdDays.textContent = '00'; cdHours.textContent = '00';
      cdMinutes.textContent = '00'; cdSeconds.textContent = '00';
      cdDisplayWrap.classList.remove('finished');
      cdResetBtn.style.display = 'none';
      cdTargetInfo.classList.remove('visible');
    });

    /* ── Page fade in ── */
    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.4s ease';
    window.addEventListener('load', () => { document.body.style.opacity = '1'; });
  </script>
</body>
</html>
